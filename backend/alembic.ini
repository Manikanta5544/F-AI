[alembic]
# Path to the migration scripts directory
script_location = alembic

# Prepend sys.path so `from app.` imports work when running alembic from /apps/api
prepend_sys_path = .

# Template for auto-generated migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone for generated timestamps
timezone = UTC

# Version separator (OS = platform default path separator)
version_path_separator = os

# Synchronous URL used ONLY for offline mode (alembic upgrade --sql).
# The actual online connection uses the async URL built in env.py.
# Use psycopg2 (sync) here — asyncpg cannot be used in offline/tooling mode.
sqlalchemy.url = postgresql+psycopg2://postgres:localdev@localhost:5432/ai_platform

[post_write_hooks]
# Uncomment to auto-format generated migrations:
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S